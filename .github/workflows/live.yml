name: live app
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-app
  # A newer push replaces an older check, but the daily scheduled run waits its turn: it used to cancel the
  # check of a fresh push (run #31 on 2026-11-12), which showed as cancelled on a commit that never failed.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  clickthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install a browser
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Check the live app runs this commit's code, then click through it
        # The footer shows a fingerprint of the code the app runs (plumbline.app.version). A deploy that did not
        # pick up the push used to pass this check on old code; now it waits up to 20 minutes, then fails as stale.
        run: |
          EXPECT=$(PYTHONPATH=src python -m plumbline.app.version)
          python scripts/clickthrough.py https://minerva-plumbline.streamlit.app/~/+/ --expect-version "$EXPECT" --wait-minutes 20

  feeds:
    # A job that never runs cannot report that it did not run. This one, on its own schedule, reads the history the
    # daily data job publishes and opens an issue if a feed has gone quiet past its promise.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Are the real feeds on time?
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PYTHONPATH: src
        run: python -m plumbline.ingest.alerts --remote
