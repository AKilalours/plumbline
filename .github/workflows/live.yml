name: live app
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-app
  cancel-in-progress: true
jobs:
  clickthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install a browser
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Give Streamlit Cloud time to redeploy
        if: github.event_name == 'push'
        run: sleep 300
      - name: Click through the live app
        run: python scripts/clickthrough.py https://minerva-plumbline.streamlit.app/~/+/
