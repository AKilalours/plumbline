name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.10 resolves to pandas 2, 3.12 to pandas 3: the two lines that disagreed on dates
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,orchestration,lake,app]"
      - name: Versions
        run: python -c "import sys, pandas, numpy, duckdb, sklearn; print(sys.version, pandas.__version__, numpy.__version__, duckdb.__version__, sklearn.__version__)"
      - name: No credentials in the repository
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9_-]{20,}|xox[abp]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!.github/workflows/tests.yml'; then
            echo "Something that looks like a credential is committed." && exit 1
          fi
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  clickthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,app]" playwright && python -m playwright install --with-deps chromium
      - name: Click through the app
        run: PLUMBLINE_E2E=1 python -m pytest -q -p no:cacheprovider tests/test_clickthrough.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t plumbline:ci .
      - name: No secrets or data inside the image
        run: |
          docker run --rm --entrypoint sh plumbline:ci -c 'test ! -e /app/.env && test ! -e /app/ops/roles.yaml && test -z "$(ls -A /app/data)" && test "$(id -u)" = 10001'
      - name: Tests inside the image
        run: |
          docker run --rm --entrypoint sh plumbline:ci -c 'pip install --user --quiet pytest "moto[server]" boto3 fastavro && python -m pytest -q -p no:cacheprovider tests/test_synth.py tests/test_ingest.py tests/test_access.py tests/test_lake.py'
      - name: Compose file is valid
        run: docker compose config -q && docker compose --profile lake config -q

  spark:
    # The loader's "current" rule written again in Spark, compared row for row with DuckDB (tests/test_spark.py).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,spark]"
      - name: Spark agrees with DuckDB, and the comparison catches a broken rule
        run: |
          java -version
          python -m pytest -q -p no:cacheprovider -rs tests/test_spark.py | tee spark.out
          grep -q "3 passed" spark.out

  kafka:
    # The Kafka consumer against a real Apache Kafka broker: crash between landing and committing, then restart.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,kafka]"
      - name: Wait for the broker
        run: |
          python - <<'PY'
          import time
          from confluent_kafka.admin import AdminClient
          a = AdminClient({"bootstrap.servers": "localhost:9092"})
          for _ in range(60):
              try:
                  a.list_topics(timeout=2); print("broker up"); break
              except Exception as e:
                  time.sleep(2)
          else:
              raise SystemExit("no Kafka broker on localhost:9092")
          PY
      - name: Consume from real Kafka, crash, restart, reconcile (the real-broker test must run, not skip)
        env:
          KAFKA_BOOTSTRAP: localhost:9092
        run: |
          python -m pytest -q -p no:cacheprovider -rs tests/test_kafka.py | tee kafka.out
          grep -q "5 passed" kafka.out
