[theme]
base = "light"
primaryColor = "#2941B9"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5FC"
textColor = "#050505"
font = "sans serif"

[client]
toolbarMode = "viewer"

[server]
headless = true
# "Try your files" reads 25,000 rows a file at most; a 200 MB upload would only tie up the small shared server
maxUploadSize = 25

[browser]
gatherUsageStats = false
