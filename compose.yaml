# docker compose run --rm pipeline                 # the whole pipeline on ./data (generate it first, see README)
# docker compose up agent dagster                  # Slack endpoint on :3000, Dagster UI on :3001
# docker compose up app                            # the demo app on http://127.0.0.1:8501
# docker compose --profile lake up -d minio && docker compose --profile lake run --rm lake
#
# Secrets go in .env next to this file (git-ignored, never copied into the image):
#   SLACK_SIGNING_SECRET, SLACK_BOT_TOKEN, PLUMBLINE_LLM_MODEL, PLUMBLINE_LLM_API_KEY, PLUMBLINE_LLM_BASE_URL,
#   MINIO_ROOT_USER, MINIO_ROOT_PASSWORD (for the lake profile)

x-plumbline: &plumbline
  build: .
  image: plumbline:local
  volumes:
    - ./data:/app/data
    - ./ops:/app/ops:ro
  env_file:
    - path: .env
      required: false

services:
  pipeline:
    <<: *plumbline
    command: ["python", "-m", "plumbline", "--score"]

  agent:
    <<: *plumbline
    command: ["python", "-m", "plumbline.agents", "serve", "--port", "3000"]
    ports: ["127.0.0.1:3000:3000"]          # put HTTPS (a tunnel or a proxy) in front before giving Slack the URL
    restart: unless-stopped

  dagster:
    <<: *plumbline
    command: ["dagster", "dev", "-m", "plumbline.ingest.orchestration", "-h", "0.0.0.0", "-p", "3001"]
    ports: ["127.0.0.1:3001:3001"]

  app:
    <<: *plumbline
    command: ["python", "-m", "streamlit", "run", "streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      PLUMBLINE_DEMO_DIR: /app/data/demo
    ports: ["127.0.0.1:8501:8501"]

  minio:
    profiles: ["lake"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes: ["./data/minio:/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  lake:
    <<: *plumbline
    profiles: ["lake"]
    depends_on: [minio]
    environment:
      PLUMBLINE_LAKE_URI: s3://plumbline/bronze-lake
      PLUMBLINE_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
    command: ["python", "-m", "plumbline.lake", "publish", "--warehouse", "/app/data/warehouse.duckdb"]
