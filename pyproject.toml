[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbline"
version = "0.1.0"
description = "A consumer data platform where every value has a receipt. Phase 0: synthetic data generator."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "pyarrow>=14",
  "faker>=24,<40",
  "duckdb>=1.1",
  "pyyaml>=6",
  "splink>=4.0.6,<5",
  "dbt-core>=1.9,<2",
  "dbt-duckdb>=1.9,<2",
  "scikit-learn>=1.4,<2",
  "scipy>=1.10",
  "pydantic>=2.5,<3",
  "sqlglot>=25,<31",
]

[project.optional-dependencies]
dev = ["pytest>=7", "moto[server]>=5", "boto3>=1.28", "fastavro>=1.8"]
lake = ["pyiceberg[sql-sqlite,pyarrow]>=0.9"]
orchestration = ["dagster>=1.9", "dagster-webserver>=1.9"]
app = ["streamlit>=1.65,<2"]

[project.scripts]
plumbline = "plumbline.__main__:main"
plumbline-synth = "plumbline.synth.cli:main"
plumbline-ingest = "plumbline.ingest.__main__:main"
plumbline-store = "plumbline.store.__main__:main"
plumbline-identity = "plumbline.identity.__main__:main"
plumbline-privacy = "plumbline.privacy.__main__:main"
plumbline-ml = "plumbline.ml.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Our own code must not use anything numpy or pandas has deprecated.
filterwarnings = ["error::DeprecationWarning:plumbline", "error::FutureWarning:plumbline"]
